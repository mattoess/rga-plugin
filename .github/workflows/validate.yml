name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json
      - name: Marketplace manifest
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Every skill has a name matching its folder and a description
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            grep -q "^name: $dir$" "$f" || { echo "::error file=$f::name must be '$dir'"; fail=1; }
            grep -q "^description: ." "$f" || { echo "::error file=$f::missing description"; fail=1; }
          done
          exit $fail
      - name: Skills name only tools the connector registers
        run: |
          known="rga_whoami rga_which_organization rga_find_preps rga_create_upload_url rga_prepare_prospect rga_run_meeting_prep rga_get_prep rga_find_opportunities rga_analyze_discovery rga_get_opportunity rga_generate_proposal rga_generate_sow rga_get_document rga_get_job_status"
          fail=0
          for t in $(grep -ohE 'rga_[a-z_]+' skills/*/SKILL.md | sort -u); do
            echo " $known " | grep -q " $t " || { echo "::error::skills name unknown tool $t"; fail=1; }
          done
          exit $fail
